# CodeRabbit 설정 파일
# language: "ko-KR" # 리뷰 응답을 한국어로 설정

reviews:
  profile: "chill" # 어떤 태도로 임할지 결정 (선택: assertive, chill)
  auto_review:
    enabled: true # PR이 올라오면 자동으로 리뷰 시작
  summary:
    # PR 요약을 영어로 작성하도록 지시
    instructions: "이 PR의 변경 사항을 영어로 간결하게 요약해줘."
  
  # 리뷰에서 제외할 파일들 (소음 방지)
  path_filters:
    - "!**/target/**"
    - "!**/build/**"
    - "!**/*.json"
    - "!**/*.md"
    - "!**/gradle/**"
    - "!**/Querydsl/**" # 자동 생성된 Querydsl 파일 제외

  # 구체적인 리뷰 지침 (핵심!)
  instructions: >
    1. Clean Code 원칙과 객체지향 설계(SOLID) 관점에서 코드를 검토해줘.
    2. 불필요한 주석이나 사용하지 않는 임포트가 있다면 지적해줘.

chat:
  enabled: true # 리뷰 결과에 대해 대화(질문) 가능